<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>What PP2A does</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="cryo/cryo.css">
</head>
<body>
<svg class="stage" viewBox="0 0 1180 740" preserveAspectRatio="xMidYMid meet" id="sv"></svg>
<script src="cryo/cryo.js"></script>
<script>
/* Schematic: kinases switch signalling proteins on by phosphorylating Ser/Thr; PP2A switches them off. */
const sv = document.getElementById('sv');
const g = S('g', {}, sv);
function blob(p, cx, cy, rx, ry, col, op) {
  S('path', { d: `M${cx - rx},${cy} C${cx - rx},${cy - ry * 1.15} ${cx + rx * .9},${cy - ry * 1.2} ${cx + rx},${cy - ry * .1} C${cx + rx * 1.08},${cy + ry} ${cx - rx * .7},${cy + ry * 1.12} ${cx - rx},${cy} z`,
    fill: col, opacity: op, stroke: '#0e1116', 'stroke-width': 2 }, p);
}
function pp2a(p, cx, cy, sc, op) {           // small ABC icon
  const q = S('g', { opacity: op }, p);
  S('path', { d: `M${cx - 60 * sc},${cy + 26 * sc} Q${cx},${cy - 38 * sc} ${cx + 60 * sc},${cy + 26 * sc}`, class: 'w', stroke: '#e5484d', 'stroke-width': 16 * sc, 'stroke-linecap': 'round' }, q);
  blob(q, cx - 22 * sc, cy - 30 * sc, 30 * sc, 26 * sc, '#3b82f6', 1); blob(q, cx + 26 * sc, cy - 24 * sc, 26 * sc, 22 * sc, '#f2a33a', 1);
  S('text', { x: cx, y: cy + 62 * sc, 'text-anchor': 'middle', 'font-size': 20 * sc + 4, 'font-weight': 700, fill: '#e5ebf0', text: 'PP2A' }, q);
}
const foot = S('text', { x: 590, y: 676, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 600 }, sv);
const foot2 = S('text', { x: 590, y: 708, 'text-anchor': 'middle', 'font-size': 18, class: 'mut' }, sv);
const TX = [
  ['A signalling protein inside the cell, with serine/threonine sites', 'whether it is “on” or “off” is set by phosphate groups on those sites'],
  ['A kinase adds a phosphate (from ATP): the protein switches ON', 'e.g. a growth signal passed along a pathway'],
  ['PP2A removes the phosphate: the protein switches OFF', 'phosphatases are the off switch that ends the signal'],
  ['Kinases and phosphatases set the balance', 'PP2A and PP1 together account for ≈ 90 % of cellular Ser/Thr phosphatase activity'],
  ['PP2A has many targets: which one depends on its B subunit', 'growth (AKT, ERK), proliferation (c-Myc), tumour suppression (p53), neurons (tau), mitotic exit'],
  ['When PP2A fails, signals get stuck ON', 'a tumour suppressor: lost or mutated in many cancers (A-subunit hot spots P179, R183); tau stays phosphorylated in Alzheimer’s']
];
const T = TX.map((_, k) => ({ k }));
let ph = 0;
Cryo.init(T, (P, t, dt) => {
  ph += Math.max(0, dt || 0);
  const k = Math.round(P.k); g.innerHTML = '';
  if (k <= 2) {
    const on = k === 1, px = 590, py = 330;
    if (on) S('circle', { cx: px, cy: py, r: 150, fill: '#5bd67a', opacity: .12 + .05 * Math.sin(ph * 4) }, g);
    blob(g, px, py, 130, 100, on ? '#5bd67a' : '#6c7682', 1);
    S('text', { x: px, y: py + 8, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 700, fill: '#0e1116', text: on ? 'ON' : (k === 2 ? 'OFF' : 'signalling protein') }, g);
    [[-60, -80], [40, -92]].forEach(([dx, dy], i) => { S('circle', { cx: px + dx, cy: py + dy, r: 9, fill: '#0e1116' }, g);
      S('text', { x: px + dx, y: py + dy + 30, 'text-anchor': 'middle', 'font-size': 15, fill: '#0e1116', text: i ? 'Thr' : 'Ser' }, g); });
    if (k === 1) { blob(g, 260, 200, 90, 70, '#b48cf2', 1); S('text', { x: 260, y: 207, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: '#0e1116', text: 'kinase' }, g);
      S('text', { x: 260, y: 300, 'text-anchor': 'middle', 'font-size': 16, class: 'mut', text: 'ATP → ADP' }, g);
      const u = Cryo.static ? 1 : Math.min(1, (ph % 3) / 1.5);
      [[-60, -80], [40, -92]].forEach(([dx, dy]) => { const x = 320 + (px + dx - 320) * u, y = 220 + (py + dy - 220) * u;
        S('circle', { cx: x, cy: y - 22, r: 16, fill: '#ffd166' }, g); S('text', { x, y: y - 16, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 700, fill: '#0e1116', text: 'P' }, g); }); }
    if (k === 2) { pp2a(g, 900, 230, 1.5, 1);
      const u = Cryo.static ? 1 : Math.min(1, (ph % 3) / 1.5);
      [[-60, -80], [40, -92]].forEach(([dx, dy], i) => { const x = px + dx + (980 - px - dx + i * 60) * u, y = py + dy + (470 - py - dy) * u;
        S('circle', { cx: x, cy: y - 22, r: 16, fill: '#ffd166', opacity: 1 - .5 * u }, g); S('text', { x, y: y - 16, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 700, fill: '#0e1116', text: 'P' }, g); });
      S('text', { x: 1010, y: 520, 'text-anchor': 'middle', 'font-size': 16, class: 'mut', text: 'free phosphate released' }, g); }
  } else if (k === 3) {
    // see-saw: kinases vs phosphatases
    const tilt = 0.06 * Math.sin(ph * 1.5);
    S('polygon', { points: '590,470 560,530 620,530', fill: '#3a424d' }, g);
    const x1 = 590 - 360 * Math.cos(tilt), y1 = 470 + 360 * Math.sin(tilt), x2 = 590 + 360 * Math.cos(tilt), y2 = 470 - 360 * Math.sin(tilt);
    S('line', { x1, y1, x2, y2, stroke: '#c9d1d9', 'stroke-width': 8, 'stroke-linecap': 'round' }, g);
    blob(g, x1 + 40, y1 - 80, 90, 60, '#b48cf2', 1); S('text', { x: x1 + 40, y: y1 - 72, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: '#0e1116', text: 'kinases: ON' }, g);
    pp2a(g, x2 - 60, y2 - 90, 1.4, 1); S('text', { x: x2 - 60, y: y2 - 200, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 700, fill: '#e5ebf0', text: 'phosphatases: OFF' }, g);
    S('text', { x: 590, y: 150, 'text-anchor': 'middle', 'font-size': 30, 'font-weight': 700, fill: C.label, text: 'PP2A + PP1 ≈ 90 % of Ser/Thr dephosphorylation' }, g);
  } else {
    pp2a(g, 590, 330, 2.0, 1);
    const TG = [['AKT', 'growth/survival', 230, 170], ['ERK', 'growth signalling', 950, 170], ['c-Myc', 'proliferation', 200, 450], ['p53', 'tumour suppression', 980, 450], ['tau', 'neurons', 590, 560], ['CDK substrates', 'mitotic exit', 590, 120]];
    TG.forEach(([n, d, x, y]) => { const bad = k === 5;
      S('line', { x1: 590, y1: 300, x2: x, y2: y, stroke: bad ? C.red : '#3a424d', 'stroke-width': 2, 'stroke-dasharray': bad ? '6 6' : '' }, g);
      S('rect', { x: x - 95, y: y - 32, width: 190, height: 64, rx: 12, fill: bad ? 'rgba(242,100,90,.16)' : '#1A1F27', stroke: bad ? C.red : '#5bd67a', 'stroke-width': 2 }, g);
      S('text', { x, y: y - 4, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: '#e5ebf0', text: n }, g);
      S('text', { x, y: y + 20, 'text-anchor': 'middle', 'font-size': 14, class: 'mut', text: bad ? 'stuck ON' : d }, g); });
    if (k === 5) S('text', { x: 590, y: 66, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 700, fill: C.red, text: 'PP2A lost → cancer, neurodegeneration' }, g);
  }
  foot.textContent = TX[k][0]; foot2.textContent = TX[k][1];
});
</script>
</body></html>
