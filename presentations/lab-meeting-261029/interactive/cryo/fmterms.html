POSES.forEach(([ax, th, [tx, ty]], j) => { const n = Math.hypot(...ax), R = rotM(ax.map(a => a / n), th), im = new Float64Array(N * N);

  seed = 31 + j; const sdv = sd(im), mx = Math.max(...im);

SC.poseTxt = el('div', 'sc pose', DATA.pose, { left: '520px', top: '360px', width: '560px' });
/* Gaussian noise */
SC.noise = el('div', 'sc', '', { left: '0px', top: '0px' });
canvas(noiseReal, v => tint(COL.N, 0.5 + v / 5), 60, 372, 200, SC.noise);
const gNoise = S('g', {}, sv);
SC.noiseTxt = el('div', 'sc pose', DATA.noise, { left: '610px', top: '360px', width: '480px' });
/* a drawing layer above every image and card: boxes, crosshairs and shift arrows */
const svTop = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svTop.setAttribute('viewBox', '0 0 1120 740'); stage.appendChild(svTop);
const gPose = S('g', {}, svTop);
const scenesFor = k => k === 1 ? ['read'] : k === 2 ? ['ctf'] : k === 3 ? ['ask'] : k === 4 ? ['props'] : k === 5 ? ['props', 'tline'] : k === 6 ? ['pose', 'poseTxt'] : k === 7 ? ['noise', 'noiseTxt'] : [];

/* ---------------- term boxes, images under them, brace labels ---------------- */
let BOX = {};
function measure() { const st = stage.getBoundingClientRect();
  GRP.forEach(g => { const e = document.querySelector('#eqs .g42' + g); if (!e) return; const r = e.getBoundingClientRect();
    BOX[g] = { x0: (r.left - st.left) / SCALE, x1: (r.right - st.left) / SCALE, y1: (r.bottom - st.top) / SCALE }; });
  if (!BOX.Y) return;
  const cx = GRP.map(g => (BOX[g].x0 + BOX[g].x1) / 2);

  const over = cx[4] + IW / 2 - 1090; if (over > 0) for (let j = 0; j < 5; j++) cx[j] -= over;

  ops.forEach((o, j) => { o.style.left = (cx[j] + cx[j + 1]) / 2 + 'px'; o.style.top = IY + IW / 2 + 'px'; }); }

let lastK = -1;
function applyStep(k) {
  const b = document.body; b.classList.toggle('s', k >= 1);
  ['Y', 'C', 'V', 'E', 'N', 'R2', 'Ut'].forEach(g => b.classList.toggle('n' + g, (GLOW[k] || []).includes(g)));
  GRP.forEach(g => b.classList.toggle('d' + g, !!FOCUS[k] && !FOCUS[k].includes(g)));
  const on = scenesFor(k); for (const n in SC) SC[n].style.opacity = on.includes(n) ? 1 : 0;
  cardT.style.opacity = k === 5 ? 1 : ''; cardC.style.opacity = k === 5 ? .3 : '';
  cardT.style.boxShadow = k === 5 ? `0 0 22px ${COL.T}66` : 'none';
  lastK = k; }

const T = Array.from({ length: 8 }, (_, k) => ({ k, img: k >= 1 ? 1 : 0 }));
Cryo.onStep = (s, old) => { if (Math.abs(s - old) > 1) Object.assign(Cryo.P, T[Math.min(s, T.length - 1)]); };
let clock = 0;
Cryo.init(T, (P, t, dt) => {
  clock += dt || 0;
  const k = Math.round(P.k);
  if (k !== lastK) applyStep(k);
  GRP.forEach(g => { const f = FOCUS[k]; timg[g].style.opacity = P.img * (f && !f.includes(g) ? .28 : 1); });
  ops.forEach(o => o.style.opacity = P.img * (FOCUS[k] ? .5 : 1));

  if (P.img > 0.01) for (const g of GRP) { const B = BOX[g]; if (!B) continue; const f = FOCUS[k], a = P.img * (f && !f.includes(g) ? .28 : 1), y = B.y1 + 2, xm = (B.x0 + B.x1) / 2;
    S('path', { d: `M${B.x0 + 3},${y} v5 H${B.x1 - 3} v-5`, fill: 'none', stroke: GCOL[g], 'stroke-width': 1.5, opacity: a }, gBr);

    S('path', { d: `M${xm},${y + 27} C${xm},${y + 45} ${B.cx},${IY - 30} ${B.cx},${IY - 6}`, fill: 'none', stroke: GCOL[g], 'stroke-width': 1.3, 'stroke-dasharray': '3 4', opacity: .7 * a }, gLink);
    S('rect', { x: B.cx - IW / 2 - 2, y: IY - 2, width: IW + 4, height: IW + 4, rx: 8, fill: 'none', stroke: GCOL[g], 'stroke-width': 2, opacity: a }, gLink); }
  /* step 5: the shift arrow on the shifted image of the shift card; step 6: the boxed particles */
  gPose.innerHTML = '';
  if (k === 6) {
    S('text', { x: 52, y: 362, 'font-size': 14, 'font-weight': 600, fill: '#9AA3AE', text: 'particles picked from one micrograph (beam into the page ⊗)' }, gPose);
    POSES.forEach(([, , [tx, ty]], j) => { const x0 = BX[j] + BOXW / 2, y0 = BY + BOXW / 2, sc = BOXW / N, x1 = x0 + tx * sc, y1 = y0 + ty * sc;
      S('rect', { x: BX[j] - 1, y: BY - 1, width: BOXW + 2, height: BOXW + 2, fill: 'none', stroke: '#ECEDEF', 'stroke-dasharray': '5 4', 'stroke-width': 1.5 }, gPose);
      S('path', { d: `M${x0 - 6},${y0} h12 M${x0},${y0 - 6} v12`, stroke: '#ECEDEF', 'stroke-width': 1.5 }, gPose);
      S('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: COL.T, 'stroke-width': 3 }, gPose);
      S('circle', { cx: x1, cy: y1, r: 3.5, fill: COL.T }, gPose);
      S('text', { x: x0, y: BY + BOXW + 22, 'text-anchor': 'middle', 'font-size': 16, class: 'm', 'font-style': 'italic', fill: COL.R, text: `R${'₁₂₃'[j]}` }, gPose);
      S('text', { x: x0 + 22, y: BY + BOXW + 22, 'text-anchor': 'start', 'font-size': 16, class: 'm', 'font-weight': 700, fill: COL.T, text: `t${'₁₂₃'[j]}` }, gPose); });
    S('text', { x: 52, y: BY + BOXW + 56, 'font-size': 14.5, fill: '#C9D1D9', text: 'each particle: its own orientation (Rᵢ) and its own offset from the box centre (tᵢ)' }, gPose);
  }
  if (k === 5) { const c = cardT.getBoundingClientRect(), st = stage.getBoundingClientRect();
    const x0 = (c.left - st.left) / SCALE, y0 = (c.top - st.top) / SCALE, w = 92, gap = (520 - 2 * w) / 3, xi = x0 + 2 * gap + w + w / 2, yi = y0 + 128 + w / 2, sc = w / N;
    S('path', { d: `M${xi - 6},${yi} h12 M${xi},${yi - 6} v12`, stroke: '#ECEDEF', 'stroke-width': 1.5 }, gPose);
    S('line', { x1: xi, y1: yi, x2: xi + TX * sc, y2: yi + TY * sc, stroke: COL.T, 'stroke-width': 3 }, gPose);
    S('circle', { cx: xi + TX * sc, cy: yi + TY * sc, r: 3.5, fill: COL.T }, gPose); }
  /* step 7: histogram of the noise values with the Gaussian it follows */
  gNoise.innerHTML = '';
  if (k === 7) { const x0 = 300, y0 = 560, W = 270, H = 170, NB = 31, lo = -4, hi = 4, hist = new Array(NB).fill(0);
    noiseReal.forEach(v => { const b = Math.floor((v - lo) / (hi - lo) * NB); if (b >= 0 && b < NB) hist[b]++; });
    const bw = W / NB, peak = N * N * (hi - lo) / NB / Math.sqrt(2 * Math.PI);

    let d = ''; for (let i = 0; i <= 80; i++) { const v = lo + (hi - lo) * i / 80; d += (i ? 'L' : 'M') + (x0 + W * i / 80).toFixed(1) + ',' + (y0 - H * Math.exp(-v * v / 2)).toFixed(1); }
    S('path', { d, fill: 'none', stroke: '#ECEDEF', 'stroke-width': 2.5 }, gNoise);
    S('line', { x1: x0, y1: y0, x2: x0 + W, y2: y0, stroke: '#5A6573' }, gNoise);
