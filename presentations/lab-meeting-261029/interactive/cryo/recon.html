<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reconstruction with known poses</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=STIX+Two+Text:ital@0;1&display=swap">
<link rel="stylesheet" href="cryo.css">
<style>
.side { font: 400 18px/1.36 "Archivo", sans-serif; color: #9AA3AE; }
.side b { color: #ECEDEF; font-weight: 600; }
.side .eq { font-family: "STIX Two Text", Georgia, serif; font-size: 25px; color: #ECEDEF; margin: 2px 0 14px; white-space: nowrap; }
.side .eq i { font-style: italic; }
.hl-w { color: #FFD166; } .hl-b { color: #4FD1E8; } .hl-s { color: #5BD67A; }
.side p { margin: 0 0 10px; }
.cap { font: 600 16px "Archivo", sans-serif; color: #ECEDEF; text-align: center; }
.cap span { display: block; font-weight: 400; font-size: 14px; color: #9AA3AE; }
</style>
</head>
<body>
<svg class="stage" viewBox="0 0 1180 740" preserveAspectRatio="xMidYMid meet" id="sv"></svg>
<script src="cryo.js"></script>
<script>
const sv = document.getElementById('sv');
const N = 64, PS = 216;
/* ---------- numerics: radix-2 FFT, phantom, deterministic noise ---------- */
function fft1(re, im, inv) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) { let b = n >> 1; for (; j & b; b >>= 1) j ^= b; j ^= b; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
  for (let len = 2; len <= n; len <<= 1) {
    const a = (inv ? 2 : -2) * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a);
    for (let i = 0; i < n; i += len) { let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ur = re[i + k], ui = im[i + k], xr = re[i + k + len / 2], xi = im[i + k + len / 2];
        const vr = xr * cr - xi * ci, vi = xr * ci + xi * cr;
        re[i + k] = ur + vr; im[i + k] = ui + vi; re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t; } } }
  if (inv) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
}
function fft2(re, im, inv) {
  const r = new Float64Array(N), c = new Float64Array(N);
  for (let y = 0; y < N; y++) { for (let x = 0; x < N; x++) { r[x] = re[y * N + x]; c[x] = im[y * N + x]; } fft1(r, c, inv); for (let x = 0; x < N; x++) { re[y * N + x] = r[x]; im[y * N + x] = c[x]; } }
  for (let x = 0; x < N; x++) { for (let y = 0; y < N; y++) { r[y] = re[y * N + x]; c[y] = im[y * N + x]; } fft1(r, c, inv); for (let y = 0; y < N; y++) { re[y * N + x] = r[y]; im[y * N + x] = c[y]; } }
}
const DOTS = [[-11, -9, 1], [-3, -12, 0.9], [9, -4, 1], [-8, 7, 0.8], [6, 11, 1.1], [1, 1, 0.7]];
const obj = new Float64Array(N * N);
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { let v = 0; DOTS.forEach(([dx, dy, a]) => { v += a * Math.exp(-((x - 32 - dx) ** 2 + (y - 32 - dy) ** 2) / (2 * 1.7 * 1.7)); }); obj[y * N + x] = v; }
const Fr = Float64Array.from(obj), Fi = new Float64Array(N * N); fft2(Fr, Fi, false);
const idx = (kx, ky) => (((ky % N) + N) % N) * N + (((kx % N) + N) % N);
function rng(seed) { let s = seed >>> 0; return () => { s += 0x6D2B79F5; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const gauss = r => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(2 * Math.PI * r());
const GOLD = Math.PI * (Math.sqrt(5) - 1) / 2;
const SIG = 6;                                              // per-sample noise (same units as F)
/* ---------- drawing helpers ---------- */
function panel(x, y, title, sub) {
  const fo = S('foreignObject', { x, y, width: PS, height: PS }, sv);
  const cv = document.createElement('canvas'); cv.width = N; cv.height = N; cv.className = 'px';
  Object.assign(cv.style, { width: PS + 'px', height: PS + 'px', display: 'block', borderRadius: '6px', outline: '1px solid #3A424D' });
  fo.appendChild(cv);
  const cap = S('foreignObject', { x: x - 20, y: y + PS + 6, width: PS + 40, height: 50 }, sv);
  const d = document.createElement('div'); d.className = 'cap'; d.innerHTML = title + '<span>' + sub + '</span>'; cap.appendChild(d);
  const ctx = cv.getContext('2d'); return { ctx, im: ctx.createImageData(N, N), fo, cap };
}
function paint(p, f) {           // f(x, y) -> [r, g, b]
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const c = f(x, y), o = 4 * (y * N + x); p.im.data[o] = c[0]; p.im.data[o + 1] = c[1]; p.im.data[o + 2] = c[2]; p.im.data[o + 3] = 255; }
  p.ctx.putImageData(p.im, 0, 0);
}
const gray = v => { const g = clamp(Math.round(v), 0, 255); return [g, g, g]; };
const XS = [24, 274, 524], YS = [44, 362];
const pT = panel(XS[0], YS[0], 'the true object', 'what we want: v');
const pF = panel(XS[1], YS[0], 'its 2D Fourier transform', 'cyan: frequencies measured so far');
const pW = panel(XS[2], YS[0], '<span style="display:inline;color:#FFD166;font-size:16px;font-weight:600">count per frequency</span>', 'the matrix Σ AᵢᵀAᵢ (diagonal here)');
const pB = panel(XS[1], YS[1], '<span style="display:inline;color:#4FD1E8;font-size:16px;font-weight:600">backprojection</span>', 'Σ Aᵢᵀyᵢ alone: blurred');
const pS = panel(XS[2], YS[1], '<span style="display:inline;color:#5BD67A;font-size:16px;font-weight:600">solution v̂</span>', 'backprojection ÷ count');
// view fan (bottom left)
const fan = S('g', {}, sv);
const FX = XS[0] + PS / 2, FY = YS[1] + PS / 2;
S('circle', { cx: FX, cy: FY, r: PS / 2 - 4, fill: C.panel, stroke: C.grid }, sv);
const fanG = S('g', {}, sv);
const fanT = S('text', { x: FX, y: YS[1] + PS + 26, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 600, text: '' }, sv);
const fanS = S('text', { x: FX, y: YS[1] + PS + 46, 'text-anchor': 'middle', 'font-size': 14, class: 'mut', text: 'one central line per image (pose known)' }, sv);
// side text
const side = S('foreignObject', { x: 770, y: 30, width: 400, height: 700 }, sv);
const sd = document.createElement('div'); sd.className = 'side'; side.appendChild(sd);
const EQ = '<div class="eq">(<span class="hl-w">Σ<sub>i</sub> <i>A</i><sub>i</sub>ᵀ Σ<sub>i</sub>⁻¹ <i>A</i><sub>i</sub></span>) <span class="hl-s"><i>v̂</i></span> = <span class="hl-b">Σ<sub>i</sub> <i>A</i><sub>i</sub>ᵀ Σ<sub>i</sub>⁻¹ <i>y</i><sub>i</sub></span></div>';
const TX = [
  '<p><b>2D analogue.</b> In 3D each image is a central <b>plane</b> of the 3D Fourier transform; here each 1D image is a central <b>line</b> of the 2D transform (Fourier slice theorem).</p><p>Each image <i>y</i><sub>i</sub> = <i>A</i><sub>i</sub><i>v</i> + noise, where <i>A</i><sub>i</sub> projects along a known direction (CTF and shift are left out here).</p>',
  '<p><b>One image</b> measures one line through the origin. Backprojection smears it back along the beam direction: streaks.</p><p>Dividing by the count cannot help yet: most frequencies were never measured.</p>',
  '<p><b>Six images.</b> The lines fan out from the origin, so low frequencies (centre) are measured by <b>every</b> image and high frequencies by few.</p>',
  '<p><b>Forty images.</b> The <span class="hl-b">backprojection</span> over-counts the centre, so it is blurred.</p><p>The <span class="hl-w">left-hand matrix</span> records those counts; solving the normal equations divides them out and the <span class="hl-s">solution</span> sharpens.</p>',
  '<p><b>160 noisy images.</b> Where a frequency was measured many times its noise averages down; near the edge it was measured rarely and stays noisy.</p><p>Σ<sub>i</sub><sup>−1</sup> weights each pixel by its noise. In practice this is done with FFTs and gridding, never by forming the matrix.</p>',
  '<p><b>Preferred orientation.</b> 160 images, but every beam direction within ±25°: a wedge of frequencies is never measured.</p><p>No amount of averaging fills it, and the map is stretched along the missing direction.</p>'
];
const T = [
  { n: 0, b: 0, k: 0 }, { n: 1, b: 0, k: 1 }, { n: 6, b: 0, k: 2 }, { n: 40, b: 0, k: 3 }, { n: 160, b: 0, k: 4 }, { n: 160, b: 1, k: 5 }
];
const num_r = new Float64Array(N * N), num_i = new Float64Array(N * N), w = new Float64Array(N * N);
const br = new Float64Array(N * N), bi = new Float64Array(N * N);
paint(pT, (x, y) => gray(40 + 200 * obj[y * N + x]));
let last = { n: -1, b: -1, k: -1 };
function theta(i, biased) { return biased ? (((i * GOLD) % 1) - 0.5) * (50 * Math.PI / 180) : (i * GOLD) % Math.PI; }
Cryo.init(T, P => {
  const n = Math.round(P.n), biased = P.b > 0.5, k = Math.round(P.k);
  if (k !== last.k) { sd.innerHTML = EQ + TX[k]; }
  if (n === last.n && biased === last.b) return;
  last = { n, b: biased, k };
  num_r.fill(0); num_i.fill(0); w.fill(0);
  for (let i = 0; i < n; i++) {
    const th = theta(i, biased), c = Math.cos(th), s = Math.sin(th), r = rng(1000 + i);
    const seen = new Set();
    for (let t = -31; t <= 31; t += 0.5) {
      const kx = Math.round(t * c), ky = Math.round(t * s), j = idx(kx, ky);
      if (seen.has(j)) continue; seen.add(j);
      num_r[j] += Fr[j] + SIG * gauss(r); num_i[j] += Fi[j] + SIG * gauss(r); w[j] += 1;
    }
  }
  // backprojection (RHS) and normalised solution
  br.set(num_r); bi.set(num_i); fft2(br, bi, true);
  const sr = new Float64Array(N * N), si = new Float64Array(N * N);
  for (let j = 0; j < N * N; j++) if (w[j] > 0) { sr[j] = num_r[j] / w[j]; si[j] = num_i[j] / w[j]; }
  fft2(sr, si, true);
  const sh = (x, y) => idx(x - 32, y - 32);                  // centred display of Fourier arrays
  const wmax = Math.max(1, ...w);
  paint(pF, (x, y) => { const j = sh(x, y), m = Math.log(1 + Math.hypot(Fr[j], Fi[j])) * 32; return w[j] > 0 ? [Math.min(255, 30 + m * 0.5), Math.min(255, 140 + m * 0.4), 232] : gray(m * 0.75); });
  paint(pW, (x, y) => { const v = Math.log(1 + w[sh(x, y)]) / Math.log(1 + wmax); return [Math.round(255 * v), Math.round(209 * v), Math.round(102 * v)]; });
  let bmax = 1e-9; for (let j = 0; j < N * N; j++) bmax = Math.max(bmax, Math.abs(br[j]));
  paint(pB, (x, y) => gray(40 + 215 * Math.max(0, br[y * N + x]) / bmax));
  paint(pS, (x, y) => gray(40 + 200 * sr[y * N + x]));
  fanG.innerHTML = '';
  for (let i = 0; i < Math.min(n, 160); i++) { const th = theta(i, biased), R = PS / 2 - 8;
    S('line', { x1: FX - R * Math.cos(th), y1: FY - R * Math.sin(th), x2: FX + R * Math.cos(th), y2: FY + R * Math.sin(th), stroke: C.est, 'stroke-width': n > 40 ? 1 : 2, opacity: n > 40 ? 0.45 : 0.9 }, fanG); }
  fanT.textContent = n ? `${n} image${n > 1 ? 's' : ''}` : 'no images yet';
});
</script>
</body></html>
