<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bare duplex force measurement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=STIX+Two+Text:ital@0;1&display=swap">
<link rel="stylesheet" href="cryo/cryo.css">
</head>
<body>
<svg class="stage" viewBox="0 0 1180 740" preserveAspectRatio="xMidYMid meet" id="sv"></svg>
<script src="cryo/cryo.js"></script>
<script>
/* The MD set-up behind the force-vs-distance plots: a bare 27 bp dsDNA duplex in water,
   its two end attachment points tied by a harmonic restraint, then Zocchi's variables.
   Run data: fig6_force_extension.csv (27 bp). */
const sv = document.getElementById('sv');
const LNM = 8.91, PX = 58, CX = 390, BY = 410;
const STIFF = [[32.0, 32.59, 19.7], [38.0, 38.59, 19.6], [44.0, 44.72, 24.1], [50.0, 50.94, 31.1], [58.0, 59.01, 33.5], [64.0, 65.23, 41.0]];   // x0, <x> (Å), f (pN): one stiff-restraint run each
const RUNS = [[50.9,31.1],[50.9,30.3],[59.0,33.5],[59.2,38.2],[65.2,41.0],[65.1,37.6],[32.6,19.7],[37.0,27.4],[33.0,33.9],[36.9,26.6],[38.6,19.6],[42.3,23.5],[38.6,20.8],[42.4,24.0],[44.7,24.1],[48.7,26.0],[44.8,28.1],[49.7,31.1],[50.7,22.2],[54.4,24.0],[50.8,27.9],[55.7,31.4],[59.0,32.2],[58.6,20.0],[62.8,26.1]];
const defs = S('defs', {}, sv);
const mk = (id, col) => { const m = S('marker', { id, viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 4.5, markerHeight: 4.5, orient: 'auto-start-reverse' }, defs); S('path', { d: 'M0,0 L10,5 L0,10 z', fill: col }, m); };
mk('ao', C.est); mk('ag', C.truth); mk('aw', '#c9d1d9');
/* water box */
const box = S('rect', { x: 24, y: 24, width: 740, height: 600, rx: 14, fill: 'rgba(79,209,232,.06)', stroke: '#2b5d6b', 'stroke-dasharray': '6 6' }, sv);
const boxT = S('text', { x: 44, y: 56, 'font-size': 17, fill: C.obs, text: 'water box + ions (no protein)' }, sv);
const W = S('g', {}, sv);
for (let i = 0; i < 70; i++) { const x = 44 + ((i * 97) % 700), y = 80 + ((i * 53) % 520); S('circle', { cx: x, cy: y, r: 2.2, fill: C.obs, opacity: .25 }, W); }
const dna = S('g', {}, sv);
const lab = S('g', {}, sv);
const ends = [S('circle', { r: 10, fill: C.red }, sv), S('circle', { r: 10, fill: C.red }, sv)];
const spring = S('path', { class: 'w', stroke: C.truth, 'stroke-width': 3.5 }, sv);
const sprT = S('text', { 'text-anchor': 'middle', 'font-size': 17, fill: C.truth }, sv);
const push = [S('line', { stroke: C.est, 'stroke-width': 5, 'marker-end': 'url(#ao)' }, sv), S('line', { stroke: C.est, 'stroke-width': 5, 'marker-end': 'url(#ao)' }, sv)];
const pull = [S('line', { stroke: C.truth, 'stroke-width': 5, 'marker-end': 'url(#ag)' }, sv), S('line', { stroke: C.truth, 'stroke-width': 5, 'marker-end': 'url(#ag)' }, sv)];
const x0L = S('g', {}, sv), xL = S('g', {}, sv);
function dim(g, xa, xb, y, col, txt) {
  g.innerHTML = '';
  S('line', { x1: xa, y1: y, x2: xb, y2: y, stroke: col, 'stroke-width': 2, 'marker-start': 'url(#aw)', 'marker-end': 'url(#aw)' }, g);
  [xa, xb].forEach(x => S('line', { x1: x, y1: y - 10, x2: x, y2: y + 10, stroke: col, 'stroke-width': 2 }, g));
  S('text', { x: (xa + xb) / 2, y: y + 30, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 600, fill: col, text: txt }, g);
}
/* readout panel */
const RX = 790;
const rp = S('g', {}, sv);
S('rect', { x: RX, y: 24, width: 366, height: 600, rx: 14, fill: C.panel, stroke: C.grid }, rp);
const rT = [0, 1, 2, 3].map(i => S('text', { x: RX + 20, y: 64 + i * 34, 'font-size': 18 }, rp));
/* mini plot of the runs */
const MX0 = RX + 50, MX1 = RX + 340, MY0 = 590, MY1 = 300;
const mx = x => MX0 + (MX1 - MX0) * (x - 30) / 40, my = f => MY0 - (MY0 - MY1) * f / 45;
const mp = S('g', {}, sv);
S('line', { x1: MX0, y1: MY0, x2: MX1, y2: MY0, stroke: C.grid }, mp); S('line', { x1: MX0, y1: MY0, x2: MX0, y2: MY1, stroke: C.grid }, mp);
[30, 40, 50, 60, 70].forEach(v => S('text', { x: mx(v), y: MY0 + 20, 'text-anchor': 'middle', 'font-size': 13, class: 'mut', text: v }, mp));
[0, 20, 40].forEach(v => S('text', { x: MX0 - 8, y: my(v) + 4, 'text-anchor': 'end', 'font-size': 13, class: 'mut', text: v }, mp));
S('text', { x: (MX0 + MX1) / 2, y: MY0 + 40, 'text-anchor': 'middle', 'font-size': 14, class: 'mut', text: '⟨x⟩, end-to-end distance (Å)' }, mp);
S('text', { x: MX0 + 6, y: MY1 + 4, 'font-size': 14, class: 'mut', text: 'f (pN)' }, mp);
const dots = RUNS.map(([x, f]) => S('circle', { cx: mx(x), cy: my(f), r: 5, fill: '#6fa8ff', opacity: 0 }, mp));
const cur = S('circle', { r: 9, fill: 'none', stroke: C.est, 'stroke-width': 3 }, mp);
const mpT = S('text', { x: RX + 20, y: 262, 'font-size': 16, 'font-weight': 600, text: 'one point per run (27 bp, 25 runs)' }, mp);
const foot = S('text', { x: 590, y: 676, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 600 }, sv);
const foot2 = S('text', { x: 590, y: 708, 'text-anchor': 'middle', 'font-size': 18, class: 'mut' }, sv);
/* shapes */
function arc(x) {
  let th = Math.PI;
  for (let i = 0; i < 60; i++) { const f = 2 * Math.sin(th / 2) / th - x / LNM, d = (Math.cos(th / 2) * th - 2 * Math.sin(th / 2)) / (th * th); th -= f / d; }
  const R = LNM / th, p = [];
  for (let i = 0; i <= 140; i++) { const a = -th / 2 + th * i / 140; p.push([CX + R * Math.sin(a) * PX, BY - (R * Math.cos(a) - R * Math.cos(th / 2)) * PX]); }
  return p;
}
function kinked(x) { const h = Math.sqrt(Math.max(0, (LNM / 2) ** 2 - (x / 2) ** 2)), p = [];
  for (let i = 0; i <= 140; i++) { const u = i / 140; p.push([CX + (u - .5) * x * PX, BY - h * (1 - Math.abs(u - .5) * 2) * PX]); } return p; }
function helix(g, pts) {
  g.innerHTML = ''; const n = pts.length - 1;
  const nrm = i => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; };
  [[10, '#6fa8ff'], [-10, '#9cc2ff']].forEach(([o, col]) => { let d = ''; pts.forEach((p, i) => { const [nx, ny] = nrm(i), w = o * Math.sin(i / n * Math.PI * 2 * 2.6); d += (i ? 'L' : 'M') + (p[0] + nx * w).toFixed(1) + ',' + (p[1] + ny * w).toFixed(1); }); S('path', { d, class: 'w', stroke: col, 'stroke-width': 4.5 }, g); });
  for (let k = 1; k < 27; k++) { const i = Math.round(k / 27 * n), [nx, ny] = nrm(i), w = 10 * Math.sin(i / n * Math.PI * 2 * 2.6), p = pts[i];
    S('line', { x1: p[0] + nx * w, y1: p[1] + ny * w, x2: p[0] - nx * w, y2: p[1] - ny * w, stroke: '#3d6fbf', 'stroke-width': 2.4 }, g); }
}
const TX = [
  ['A bare 27 bp dsDNA duplex in water: no protein', 'duplex = two complementary DNA strands base-paired into a double helix (our spring after hybridisation)'],
  ['Its two ends are where the spring would attach to the protein', 'contour length L = 0.33 nm per bp = 89 Å, measured along the helix'],
  ['A restraint ties the two ends together, centred at x₀ shorter than L', 'the duplex must bend; it pushes its ends apart (orange) against the restraint (green)'],
  ['The ends settle at ⟨x⟩, slightly beyond x₀: the restraint is stretched', 'its pull k(⟨x⟩ − x₀) then equals the duplex’s push f · gap drawn 4× larger than the real ≈ 1 Å'],
  ['Repeat at many x₀: each run gives one point (⟨x⟩, f)', 'so the end-to-end distance is (nearly) fixed and the force is read off'],
  ['Zocchi’s model predicts f(x) from two properties of the duplex', 'B: bending stiffness (≈ 200 pN nm²) · τc: torque at which one base-pair step gives way and the duplex kinks'],
  ['If the bend becomes too sharp (x < x_c), the model kinks the duplex', 'R: length of each straight arm; the push drops to a few pN. Next slide: model vs MD']
];
const T = TX.map((_, k) => ({ k, kink: k === 6 ? 1 : 0, dots: k >= 4 ? 1 : 0 }));
let ph = 0;
Cryo.init(T, (P, t, dt) => {
  ph += Math.max(0, dt || 0);
  const k = Math.round(P.k);
  // which run is shown: in step 4+ cycle through x0 values
  let run = STIFF[3], j = 3;
  if (k === 4) { j = (Math.floor(ph / 1.8) % STIFF.length + STIFF.length) % STIFF.length; run = STIFF[j]; }
  let x0 = run[0] / 10, xm = run[1] / 10;
  const jit = k >= 3 ? 0.04 * Math.sin(ph * 5.3) + 0.03 * Math.sin(ph * 8.1) : 0;
  const shown = k >= 3 && k < 5 ? xm + jit : (k === 2 ? x0 + 0.09 : 6.6);
  const xd = k >= 3 && k < 5 ? x0 + (shown - x0) * 4 : shown;                     // exaggerate the gap for display
  const p1 = arc(xd), p2 = kinked(xd);
  helix(dna, p1.map((p, i) => [lerp(p[0], p2[i][0], P.kink), lerp(p[1], p2[i][1], P.kink)]));
  const xl = CX - xd / 2 * PX, xr = CX + xd / 2 * PX;
  ends[0].setAttribute('cx', xl); ends[0].setAttribute('cy', BY); ends[1].setAttribute('cx', xr); ends[1].setAttribute('cy', BY);
  [ends[0], ends[1]].forEach(e => e.setAttribute('opacity', k >= 1 ? 1 : 0.35));
  // restraint spring (zigzag) under the ends
  const sy = BY + 46; let d = `M${xl},${BY + 10} L${xl},${sy}`; const nz = 16;
  for (let i = 1; i < nz; i++) d += ` L${xl + (xr - xl) * i / nz},${sy + (i % 2 ? -10 : 10)}`;
  d += ` L${xr},${sy} L${xr},${BY + 10}`;
  spring.setAttribute('d', d); spring.setAttribute('opacity', k >= 2 && k < 5 ? 1 : 0);
  sprT.setAttribute('x', CX); sprT.setAttribute('y', sy + 34); sprT.textContent = k >= 2 ? 'restraint U = ½ k (x − x₀)²' : ''; sprT.setAttribute('opacity', k >= 2 && k < 5 ? 1 : 0);
  const showF = k >= 2 && k < 5 ? 1 : 0;
  push[0].setAttribute('x1', xl - 14); push[0].setAttribute('y1', BY - 6); push[0].setAttribute('x2', xl - 80); push[0].setAttribute('y2', BY - 6);
  push[1].setAttribute('x1', xr + 14); push[1].setAttribute('y1', BY - 6); push[1].setAttribute('x2', xr + 80); push[1].setAttribute('y2', BY - 6);
  pull[0].setAttribute('x1', xl - 80); pull[0].setAttribute('y1', BY + 16); pull[0].setAttribute('x2', xl - 16); pull[0].setAttribute('y2', BY + 16);
  pull[1].setAttribute('x1', xr + 80); pull[1].setAttribute('y1', BY + 16); pull[1].setAttribute('x2', xr + 16); pull[1].setAttribute('y2', BY + 16);
  push.forEach(a => a.setAttribute('opacity', showF)); pull.forEach(a => a.setAttribute('opacity', showF));
  // dimension lines
  if (k >= 2 && k < 5) dim(x0L, CX - x0 / 2 * PX, CX + x0 / 2 * PX, BY + 96, C.truth, `x₀ = ${(x0 * 10).toFixed(0)} Å (restraint centre)`); else x0L.innerHTML = '';
  if (k >= 3) dim(xL, xl, xr, BY + 150, '#c9d1d9', k >= 5 ? 'x: end-to-end distance' : `⟨x⟩ = ${(xm * 10).toFixed(0)} Å (where the ends sit)`); else xL.innerHTML = '';
  // labels on the duplex
  lab.innerHTML = '';
  if (k === 0) S('text', { x: CX, y: 120, 'text-anchor': 'middle', 'font-size': 20, fill: '#9cc2ff', text: 'strand 1 + strand 2, 27 base pairs' }, lab);
  if (k === 1) { S('text', { x: CX, y: 120, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: '#9cc2ff', text: 'L = 89 Å along the helix' }, lab);
    S('text', { x: xl - 10, y: BY + 40, 'text-anchor': 'end', 'font-size': 16, fill: C.red, text: 'end 1' }, lab); S('text', { x: xr + 10, y: BY + 40, 'font-size': 16, fill: C.red, text: 'end 2' }, lab); }
  if (k === 5) { S('text', { x: CX, y: 110, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: '#9cc2ff', text: 'B: how hard it resists bending' }, lab); }
  if (k === 6) { const apex = p2[70]; S('text', { x: apex[0], y: apex[1] - 26, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: C.red, text: 'kink: torque reached τc' }, lab);
    const m = p2[35]; S('text', { x: m[0] - 18, y: m[1] - 8, 'text-anchor': 'end', 'font-size': 22, 'font-weight': 700, fill: '#9cc2ff', text: 'R' }, lab);
    const m2 = p2[105]; S('text', { x: m2[0] + 18, y: m2[1] - 8, 'font-size': 22, 'font-weight': 700, fill: '#9cc2ff', text: 'R' }, lab); }
  // readout
  const lines = k < 2 ? ['', '', '', ''] : k < 3 ? ['restraint centre x₀ = ' + (x0 * 10).toFixed(0) + ' Å', 'stiffness k = 200 kJ mol⁻¹ nm⁻²', '', '']
    : k < 5 ? ['x₀ = ' + run[0].toFixed(0) + ' Å    ⟨x⟩ = ' + run[1].toFixed(1) + ' Å', 'stretch ⟨x⟩ − x₀ = ' + (run[1] - run[0]).toFixed(2) + ' Å', 'f = k (⟨x⟩ − x₀) = ' + run[2].toFixed(1) + ' pN', k === 4 ? 'run ' + (j + 1) + ' of 6 shown (stiff restraint)' : 'one real 27 bp run']
    : ['Zocchi’s model (no simulation):', 'L = 89 Å, B ≈ 200 pN nm²,', 'τc ≈ 34 pN nm (27 if nicked)', k === 6 ? 'kinks below x_c = 86 Å' : ''];
  rT.forEach((e, i) => { e.textContent = lines[i]; e.setAttribute('fill', i === 2 ? C.est : C.text); e.setAttribute('font-weight', i === 2 ? 700 : 400); });
  dots.forEach((dd, i) => dd.setAttribute('opacity', (P.dots * (i < 25 ? 0.85 : 0)).toFixed(2)));
  mp.setAttribute('opacity', P.dots.toFixed(2));
  cur.setAttribute('cx', mx(run[1])); cur.setAttribute('cy', my(run[2])); cur.setAttribute('opacity', k === 4 ? 1 : 0);
  foot.textContent = TX[k][0]; foot2.textContent = TX[k][1];
});
</script>
</body></html>
