<title>Lab Meeting 261029</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a fixed 1920x1080 stage scaled to the window; each gel slide is a
   title row, one or two gel panels (imager-dark slab, label rails either
   side) and a caption line; the footer carries section, step dots, page. */
:root {
  --paper: #f3f5f7;
  --paper-2: #e7ebef;
  --ink: #14202b;
  --ink-2: #4a5866;
  --ink-3: #7a8794;
  --rule: #d3dae1;
  --violet: #5b48d6;
  --teal: #0c7c70;
  --amber: #b86e00;
  --sec-synthesis: #2e7d4f;
  --sec-assay: #2f63c4;
  --sec-md: #a8406f;
  --sec-background: #5a646e;
  --sec-status: #b8372c;
  --sec-cryoem: #1f8aa6;
  --dna-line: #15191d;
  --protein-stroke: #1b2026;
  --letterbox: #dfe4e9;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b232c; --paper-2: #26303b; --ink: #e5ebf0; --ink-2: #a3b0bc; --ink-3: #6f7d8a;
    --rule: #313d49; --violet: #a597ff; --teal: #5ed6c8; --amber: #ffb547;
    --sec-synthesis: #5fbf86; --sec-assay: #7ea8f5; --sec-md: #e486b2; --sec-background: #9aa6b1; --sec-status: #f07a6e; --sec-cryoem: #5fc8e4;
    --dna-line: #e5ebf0; --protein-stroke: #0b0f13; --letterbox: #070a0d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b232c; --paper-2: #26303b; --ink: #e5ebf0; --ink-2: #a3b0bc; --ink-3: #6f7d8a;
  --rule: #313d49; --violet: #a597ff; --teal: #5ed6c8; --amber: #ffb547;
  --sec-synthesis: #5fbf86; --sec-assay: #7ea8f5; --sec-md: #e486b2; --sec-background: #9aa6b1; --sec-status: #f07a6e; --sec-cryoem: #5fc8e4;
  --dna-line: #e5ebf0; --protein-stroke: #0b0f13; --letterbox: #070a0d;
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; }
body {
  background: var(--letterbox); color: var(--ink);
  font-family: var(--font-display); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; box-sizing: border-box;
}
#viewport { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; }
#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
  transform-origin: 0 0; background: var(--paper); overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,.18);
}
.slide { position: absolute; inset: 0; visibility: hidden; opacity: 0; transition: opacity .35s ease, visibility 0s linear .35s; }
.slide.on { visibility: visible; opacity: 1; transition: opacity .35s ease; }
.slide.static img.full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }

/* ---------- slide chrome ---------- */
.s-title {
  position: absolute; left: 96px; top: 58px; width: 1728px; margin: 0;
  font-size: 56px; line-height: 1.08; font-weight: 640; font-stretch: 92%;
  letter-spacing: -0.01em; text-wrap: balance; color: var(--ink);
}
.s-sub { position: absolute; left: 98px; width: 1700px; margin: 0; font-size: 28px; font-weight: 420; color: var(--ink-2); }
.s-foot { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 24px; padding: 0 40px 0 96px; border-top: 1px solid var(--rule); }
.sec-tag { font-family: var(--font-mono); font-size: 18px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; gap: 12px; color: var(--ink-2); }
.sec-tag::before { content: ""; width: 26px; height: 8px; border-radius: 4px; background: var(--sec, var(--ink-3)); }
.s-page { margin-left: auto; font-family: var(--font-mono); font-size: 18px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 8px; align-items: center; margin-left: 24px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink-3); box-sizing: border-box; transition: background .2s, border-color .2s, transform .2s; }
.dots i.done { background: var(--ink-3); }
.dots i.now { background: var(--sec, var(--ink)); border-color: var(--sec, var(--ink)); transform: scale(1.25); }
.callout { position: absolute; background: var(--paper-2); border-radius: 10px; padding: 18px 24px; font-size: 23px; line-height: 1.35; color: var(--ink-2); box-sizing: border-box; }
.callout b { color: var(--ink); }

/* ---------- gel panel ---------- */
.panel { position: absolute; }
.panel-head { position: absolute; transform: translateY(-100%); font-size: 24px; line-height: 1.2; font-weight: 560; color: var(--ink-2); text-align: center; text-wrap: balance; }
.caption {
  position: absolute; font-size: 24px; line-height: 1.3; color: var(--ink-2); display: flex; gap: 14px; align-items: baseline;
  transition: opacity .3s;
}
.caption .k { font-family: var(--font-mono); font-size: 18px; font-weight: 600; color: var(--ink-3); letter-spacing: .06em; white-space: nowrap; }
.caption b { color: var(--ink); font-weight: 600; }

.gel { position: absolute; inset: 0; }
.slab { position: absolute; }
.gel.dark .slab { background-color: #10151a; }
.gel.light .slab { background-color: #d9d7d0; }
.gel.mid .slab { background-color: #6f7a85; }
.gel.mid .well { background: #3e4750; box-shadow: inset 0 -1px 0 rgba(255,255,255,.2); }
.slab .tex { position: absolute; inset: 0; opacity: .55; background-size: 256px 256px; }
.gel.light .slab .tex { opacity: .35; }
.well { position: absolute; border-radius: 2px 2px 5px 5px; }
.gel.dark .well { background: #04070a; box-shadow: inset 0 -1px 0 rgba(255,255,255,.18), 0 1px 0 rgba(255,255,255,.06); }
.gel.light .well { background: #b7b4ac; box-shadow: inset 0 -1px 0 rgba(0,0,0,.25); }
.well .dye { position: absolute; inset: 1px; border-radius: inherit; background: #3b5bff; opacity: 0; }

.band { position: absolute; will-change: transform, opacity; }
.band .rot { position: absolute; inset: 0; }
.band .core {
  position: absolute; inset: 0; border-radius: 40%;
  background: linear-gradient(180deg, transparent 0%, var(--c) 30%, var(--c) 70%, transparent 100%);
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
  opacity: var(--o, 1); filter: blur(var(--bl, 0.6px));
}
.band .hot { position: absolute; left: 14%; right: 14%; top: 35%; bottom: 35%; border-radius: 40%; background: #fff; opacity: var(--hot, 0); filter: blur(1.5px); }
.band .bloom { position: absolute; inset: -60% -8%; border-radius: 50%; background: radial-gradient(closest-side, var(--c), transparent); opacity: calc(var(--bloom, 0) * .55); }
.band .smear {
  position: absolute; left: 4%; right: 4%;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
  filter: blur(1.2px);
}
.band .smear.up { bottom: 50%; background: linear-gradient(0deg, var(--c), transparent); }
.band .smear.down { top: 50%; background: linear-gradient(180deg, var(--c), transparent); }
.gel.light .band { mix-blend-mode: multiply; }
.band .halo { position: absolute; inset: -150% -16%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,184,71,.85), rgba(255,184,71,.25) 55%, transparent); opacity: 0; pointer-events: none; }
.band.glow .halo { animation: halo 1.8s ease-in-out infinite; }
.band.glow .core { filter: blur(var(--bl, 0.6px)) brightness(1.35) saturate(1.2); }
@keyframes halo { 0%, 100% { opacity: .45; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }

.c-protein  { --c: #dde4eb; }
.c-ss       { --c: #57d9c9; }
.c-ds       { --c: #ab9dff; }
.c-circ     { --c: #ffb547; }
.c-other    { --c: #ff92b4; }
.c-impurity { --c: #a3acb6; }
.gel.light .c-protein  { --c: #2a323b; }
.gel.light .c-ss       { --c: #08665c; }
.gel.light .c-ds       { --c: #4630c4; }
.gel.light .c-circ     { --c: #a85d00; }
.gel.light .c-other    { --c: #9c2d55; }
.gel.light .c-impurity { --c: #59626b; }

.overlay-svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.arrow path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.arrow .under { stroke: #071015; stroke-width: 7; opacity: .75; }
.arrow .over { stroke: #eafff3; stroke-width: 3.2; }
.gel.light .arrow .under { stroke: #ffffff; opacity: .9; }
.gel.light .arrow .over { stroke: #10202c; }
.arrow .head-under { fill: #071015; opacity: .75; }
.arrow .head-over { fill: #eafff3; }
.gel.light .arrow .head-under { fill: #fff; }
.gel.light .arrow .head-over { fill: #10202c; }

.lane-head {
  position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap;
  font-family: var(--font-mono); font-size: 17px; font-weight: 500; line-height: 1.15; color: var(--ink);
}
.lane-head .chip { display: inline-block; padding: 1px 6px; border-radius: 6px; font-size: 15px; font-weight: 600; }
.lane-head .chip.ss { background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal); }
.lane-head .chip.ds { background: color-mix(in srgb, var(--violet) 16%, transparent); color: var(--violet); }
.lane-head .chip.ctrl { background: color-mix(in srgb, var(--ink-3) 18%, transparent); color: var(--ink-2); }
.lane-head .sub { display: block; font-size: 14px; color: var(--ink-3); }
.grp { position: absolute; height: 0; border-top: 2px solid var(--ink-2); }
.grp::before, .grp::after { content: ""; position: absolute; top: -2px; width: 2px; height: 9px; background: var(--ink-2); }
.grp::before { left: 0; } .grp::after { right: 0; }
.grp span { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); white-space: nowrap; font-size: 21px; font-weight: 620; font-stretch: 90%; color: var(--ink); }
.grp-resin { border-top: 4px solid #b86e00; }
.grp-resin::before, .grp-resin::after { background: #b86e00; width: 4px; height: 12px; }
.grp-resin span { background: #b86e00; color: #fff; padding: 3px 12px; border-radius: 999px; font-size: 16px; bottom: 8px; }
.grp-noresin { border-top: 3px dashed var(--ink-3); }
.grp-noresin::before, .grp-noresin::after { background: var(--ink-3); }
.grp-noresin span { background: var(--paper); color: var(--ink-2); border: 2px dashed var(--ink-3); padding: 2px 10px; border-radius: 999px; font-size: 16px; bottom: 40px; }

.lbl {
  position: absolute; display: flex; align-items: center; gap: 10px; box-sizing: border-box;
  transition: top .45s cubic-bezier(.3,.7,.2,1), opacity .35s ease, transform .35s ease;
}
.lbl.r { flex-direction: row; }
.lbl.l { flex-direction: row-reverse; text-align: right; }
/* sketch boxes drawn like the preprint's: white square, dark outline, fixed ink */
.lbl .ico { flex: none; width: 80px; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1.6px solid var(--ink); border-radius: 3px; background: #fbfbfa; --dna-line: #15191d; --protein-stroke: #1b2026; }
.lbl .ico svg { width: 74px; height: 50px; }
.lbl .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lbl .txt b { font-size: 20px; font-weight: 620; line-height: 1.1; color: var(--ink); font-stretch: 92%; }
.lbl .txt span { font-size: 16px; line-height: 1.2; color: var(--ink-2); }
.lbl .sw { display: inline-block; vertical-align: 1px; width: 22px; height: 11px; margin: 0 7px; border-radius: 3px; background: #10151a; position: relative; overflow: hidden; }
.lbl .sw::after { content: ""; position: absolute; left: 3px; right: 3px; top: 3.5px; height: 5px; border-radius: 3px; background: var(--c); filter: blur(.5px); }
.lbl.r .sw { margin-left: 0; }
.lbl.l .sw { float: none; }
.lbl.glow .txt b { color: var(--amber); }
.lbl.glow .sw { box-shadow: 0 0 0 2px var(--amber), 0 0 12px rgba(255,181,71,.8); }
.leader path { fill: none; stroke-width: 1.5; stroke: var(--ink-3); stroke-dasharray: 1 0; }
.gel.dark .leader path { stroke: #8d9cab; }
.leader circle { fill: var(--ink-2); }
.gel.dark .leader circle { fill: #e6edf3; }

.pin, .hl { position: absolute; }
.pin { background-repeat: no-repeat; }
.hl { box-sizing: border-box; border: 3px solid var(--amber); border-radius: 6px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 20%, transparent); opacity: 0; transition: opacity .3s; }
.hl.on { opacity: 1; }

.real { position: absolute; opacity: 0; z-index: 3; }
.sim-layer { position: relative; z-index: 1; }
.real img { width: 100%; height: 100%; display: block; }
.scanline { position: absolute; z-index: 4; height: 3px; background: linear-gradient(90deg, transparent, #c9f7ff 12%, #ffffff 50%, #c9f7ff 88%, transparent); box-shadow: 0 0 18px 4px rgba(160,235,255,.65); opacity: 0; pointer-events: none; }
.real-tag { position: absolute; z-index: 4; font-family: var(--font-mono); font-size: 16px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 8px; opacity: 0; transition: opacity .3s; }
.sim-layer { transition: opacity .5s ease; }
.fade { transition: opacity .35s ease; }
.hidden { opacity: 0 !important; pointer-events: none; }

/* ---------- bar charts (fluorometry) ---------- */
.chart-sim { position: absolute; }
.chart-sim svg { position: absolute; inset: 0; overflow: visible; }
.chart-sim text { font-family: var(--font-display); }
.chart-sim .tick { font-family: var(--font-mono); }
.chart-halo { opacity: 0; }
.chart-halo.on { animation: chalo 1.8s ease-in-out infinite; }
@keyframes chalo { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
.is-test .chart-halo.on { animation: none; opacity: .9; }
/* ---------- media slides (MD figures, videos, findings) ---------- */
.m-item { position: absolute; display: flex; flex-direction: column; gap: 8px; }
.m-frame { position: relative; flex: 1; min-height: 0; background: #fbfbf9; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; transition: box-shadow .3s, border-color .3s; }
.m-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.m-frame img, .m-frame video { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); object-fit: contain; }
.m-frame.dark { background: #0E1116; border-color: #2a313b; }
.m-frame.dark video { inset: 0; width: 100%; height: 100%; }
.m-item.mhl .m-frame { border-color: var(--amber); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 35%, transparent), 0 0 24px color-mix(in srgb, var(--amber) 35%, transparent); }
.m-cap { font-size: 19px; line-height: 1.25; color: var(--ink-2); }
.m-cap b { color: var(--ink); font-weight: 620; }
.m-pts { position: absolute; display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; }
.m-pts.cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; row-gap: 12px; }
.m-pt { font-size: 23px; line-height: 1.32; color: var(--ink-2); padding-left: 22px; position: relative; opacity: 0; transform: translateY(8px); transition: opacity .35s ease, transform .35s ease; }
.m-pt::before { content: ""; position: absolute; left: 0; top: .55em; width: 9px; height: 9px; border-radius: 2px; background: var(--sec, var(--ink-3)); }
.m-pt.on { opacity: 1; transform: none; }
.m-pt.now { color: var(--ink); }
.m-pt b { color: var(--ink); font-weight: 640; }
.eq { font-family: "STIX Two Text", "Cambria Math", Georgia, serif; font-size: 1.12em; color: var(--ink); white-space: nowrap; }
.eq i { font-style: italic; } .eq .kn { color: var(--sec-synthesis); } .eq .un { color: var(--sec-status); } .eq .nz { color: var(--ink-3); }
.m-pt b.kn { color: var(--sec-synthesis); } .m-pt b.un { color: var(--sec-status); }
.tex math { font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", math; font-size: 1.08em; }
.tex.d { display: block; margin: 8px 0 6px; }
.tex.d math { font-size: 1.22em; }
.m-pt .eq.blk { display: block; margin: 6px 0 4px; font-size: 1.12em; white-space: normal; line-height: 1.5; }
.s-badge { position: absolute; right: 64px; top: 58px; padding: 10px 22px; border-radius: 999px; color: #fff; font: 600 21px var(--font-display); letter-spacing: .02em; }
.slide.cover { display: flex; flex-direction: column; justify-content: center; padding: 0 140px; box-sizing: border-box; }
.c-title { margin: 0; font-size: 104px; font-weight: 760; letter-spacing: -.02em; color: var(--ink); }
.c-sub { margin: 18px 0 0; font-size: 40px; font-weight: 500; color: var(--ink-2); }
.c-meta { margin: 46px 0 0; font-size: 26px; color: var(--ink-3); border-top: 4px solid var(--sec-cryoem); padding-top: 22px; width: 900px; }
.m-aside { position: absolute; background: var(--paper-2); border-left: 6px solid var(--sec, var(--ink-3)); border-radius: 10px; padding: 18px 24px; font-size: 21px; line-height: 1.38; color: var(--ink-2); box-sizing: border-box; }
.m-aside b { color: var(--ink); }
.m-aside ul { margin: 8px 0 0; padding-left: 22px; }
.m-aside table.gl { border-collapse: collapse; margin-top: 8px; font-size: 17px; line-height: 1.3; }
.m-aside table.gl td { padding: 5px 8px 5px 0; vertical-align: top; border-bottom: 1px solid var(--rule); }
.m-aside table.gl td:first-child { font-family: 'STIX Two Text', Georgia, serif; font-style: italic; font-size: 20px; color: var(--ink); white-space: nowrap; padding-right: 14px; }
.m-pts.big { gap: 22px; } .m-pts.big .m-pt { font-size: 29px; } .m-pts.big .m-pt::before { top: .5em; }
.m-eqbox { position: absolute; left: 1290px; top: 690px; width: 566px; background: var(--paper-2); border-left: 6px solid var(--sec, var(--ink-3)); border-radius: 10px; padding: 12px 18px; font-size: 16px; line-height: 1.35; color: var(--ink-2); box-sizing: border-box; opacity: 0; transition: opacity .35s; }
.m-eqbox.on { opacity: 1; }
.m-eqbox .hb { display: flex; gap: 16px; align-items: flex-start; }
.m-eqbox .hb svg { flex: none; }
.m-eqbox pre.code { margin: 8px 0; padding: 8px 10px; background: #0E1116; color: #e5ebf0; border-radius: 6px; font: 13px/1.45 var(--font-mono); white-space: pre; overflow: hidden; }
.m-eqbox code { font: 13px var(--font-mono); }
.m-eqbox .tex.d { margin: 2px 0; }
.m-eqbox .tex.d math { font-size: 1.3em; }
.m-banner { position: absolute; left: 50%; top: 52%; width: 1380px; transform: translate(-50%, -46%) scale(.96); opacity: 0; pointer-events: none; z-index: 4;
  background: var(--paper); border: 3px solid var(--amber); border-radius: 22px; padding: 44px 56px; box-shadow: 0 0 0 100vmax color-mix(in srgb, var(--paper) 72%, transparent), 0 24px 60px rgba(0,0,0,.28);
  font-size: 36px; line-height: 1.4; color: var(--ink-2); transition: opacity .45s ease, transform .45s ease; }
.m-banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.m-banner.big { text-align: center; font-size: 48px; }
.m-banner .emoji { display: block; font-size: 150px; line-height: 1.1; margin-bottom: 10px; }
.m-banner.intro { top: 540px; }
.m-banner b { color: var(--ink); }
.m-banner .ttl { display: block; font-size: 24px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); margin-bottom: 14px; }
.m-pt .chip-swap { display: inline-block; margin-bottom: 8px; padding: 4px 12px; border-radius: 999px; background: var(--sec-assay); color: #fff; font-size: .85em; }
.m-pt .chip-swap b { color: #fff; }
.m-pt .headline { display: block; background: color-mix(in srgb, var(--amber) 14%, transparent); border-left: 6px solid var(--amber); border-radius: 8px; padding: 10px 16px; color: var(--ink); }
.m-pt ul.sub { margin: 6px 0 2px; padding-left: 28px; list-style: circle; }
.m-pt ul.sub li { font-size: .9em; margin: 4px 0; }
.m-pt .lead { display: block; margin-bottom: 4px; }
.t-done { color: var(--sec-synthesis); } .t-pend { color: var(--amber); } .t-todo { color: var(--sec-status); }
.m-pt table.tb { border-collapse: collapse; margin: 8px 0 4px; font-size: .9em; }
.m-pt table.tb th, .m-pt table.tb td { padding: 6px 22px 6px 0; text-align: left; border-bottom: 1px solid var(--rule); }
.m-pt table.tb th { color: var(--ink); font-weight: 640; }

const NOISE = (function () {

/* ---------------- chimera sketches (after Boral, Schnebly et al. 2026, Figs 2-4) ---------------- */
// protein: grey ellipse; tet handle: green dot; linker/reactive end: brown triangle;
// ssDNA: dark line; complementary strand: violet line alongside.
let gradN = 0;
function chimera(ic) {

  const prot = (cx, cy, rot, rx, ry) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx || 15}" ry="${ry || 9.5}" transform="rotate(${rot || 0} ${cx} ${cy})" fill="url(#${g})" stroke="var(--protein-stroke)" stroke-width="1.8"/>`;
  const handle = (x, y) => `<circle cx="${x}" cy="${y}" r="3.3" fill="#3fe6a6" stroke="#0b3b2a" stroke-width="1.1"/>`;
  const tri = (x, y, ang) => {          // small brown triangle pointing along ang (deg)
    const a = ang * Math.PI / 180, L = 6.5, W = 3.6;
    const tx = x + Math.cos(a) * L / 2, ty = y + Math.sin(a) * L / 2;
    const bx = x - Math.cos(a) * L / 2, by = y - Math.sin(a) * L / 2;
    const px = -Math.sin(a) * W, py = Math.cos(a) * W;
    return `<polygon points="${tx.toFixed(1)},${ty.toFixed(1)} ${(bx + px).toFixed(1)},${(by + py).toFixed(1)} ${(bx - px).toFixed(1)},${(by - py).toFixed(1)}" fill="#a07b66" stroke="#4a3426" stroke-width=".8"/>`;

    if (ds) o = `<path d="${d}" fill="none" stroke="#9b8cf7" stroke-width="3.2" stroke-linecap="round" transform="translate(${off ? off[0] : 2.6},${off ? off[1] : -1.4})" opacity=".95"/>` + o;
    return o;
  };
  const line = (x1, y1, x2, y2, freeEnd) => {
    const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;

    parts.push(handle(56, 38));
  } else if (k === 'circ') {         // both ends on the same protein
    const d = 'M34,40 C14,20 24,4 46,4 C68,4 78,20 58,40';
    parts.push(ds ? `<path d="M30,42 C6,20 18,-2 46,-1 C74,-2 86,20 62,42" fill="none" stroke="#9b8cf7" stroke-width="3.2" stroke-linecap="round"/>` : '');
    parts.push(`<path d="${d}" fill="none" stroke="var(--dna-line)" stroke-width="2" stroke-linecap="round"/>`);
    parts.push(tri(36, 37, 55), tri(56, 37, 125));
    parts.push(prot(46, 48, 0, 16, 10.5));
    parts.push(handle(34, 41), handle(58, 41));

/* ---------------- gel panel ---------------- */
const RAIL = 340, RAILGAP = 22, HEAD = 92;
const SHOW_ARROWS = false;

function buildPanel(slideEl, spec, P) {
  // P: {x,y,w,h, rails:['left','right'], head, caption:{x,y,w}}
  const iw = spec.size[0], ih = spec.size[1];

  const RW = RAIL + RAILGAP;
  const need = sc => ({
    l: Math.max(rails.includes('left') ? RW : 0, gx0 * sc),
    r: Math.max(rails.includes('right') ? RW : 0, (iw - gx1) * sc),
    t: Math.max(headH, gy0 * sc),

  const range = sc => {

    const ya = Math.max(P.y + headH, IB[1] + gy0 * sc), yb = Math.min(P.y + P.h - gh, IB[3] - (ih - gy0) * sc);

  const wellAt = x => wellY + (x - (gx0 + gx1) / 2) * tn;

  const root = h('div', 'panel', { style: { left: '0px', top: '0px', width: '1920px', height: '1080px' } });

  root.appendChild(gel);
  slideEl.appendChild(root);

  if (P.head) {
    root.appendChild(h('div', 'panel-head', { text: P.head, style: { left: (P.x + 8) + 'px', width: (P.w - 16) + 'px', top: (P.y - 6) + 'px' } }));

  const real = h('div', 'real', { style: { left: X(0) + 'px', top: Y(0) + 'px', width: iw * sc + 'px', height: ih * sc + 'px' } });

  gel.appendChild(real);

  gel.appendChild(realTag);

  const sim = h('div', 'sim-layer'); gel.appendChild(sim);
  (spec.pins || []).forEach(r => {
    sim.appendChild(h('div', 'pin', { style: {
      left: X(r[0]) + 'px', top: Y(r[1]) + 'px', width: r[2] * sc + 'px', height: r[3] * sc + 'px',
      backgroundImage: `url("${spec.image}")`, backgroundSize: `${iw * sc}px ${ih * sc}px`,
      backgroundPosition: `${-r[0] * sc}px ${-r[1] * sc}px` } }));
  });

  // slab
  const slab = h('div', 'slab', { style: { left: X(gx0) + 'px', top: Y(gy0) + 'px', width: gw + 'px', height: gh + 'px',
    clipPath: 'polygon(' + poly.map(p => `${(p[0] - gx0) * sc}px ${(p[1] - gy0) * sc}px`).join(',') + ')' } });
  slab.appendChild(h('div', 'tex', { style: { backgroundImage: `url(${NOISE})` } }));
  sim.appendChild(slab);

  // wells
  const wells = {};
  const wellXs = (spec.gel.wells || spec.lanes.map(l => ({ x: laneX(l, wellY), w: l.w, id: l.id })));
  wellXs.forEach(wd => {
    const wx = wd.x, wwid = (wd.w || 20) * .9;
    const wy = wellAt(wx);
    const el = h('div', 'well', { style: { left: X(wx - wwid / 2) + 'px', top: Y(wy) - 5 + 'px', width: wwid * sc + 'px', height: Math.max(8, 2.2 * sc) + 'px', transform: `rotate(${tilt}deg)` } });
    const dye = h('div', 'dye'); el.appendChild(dye);
    sim.appendChild(el);
    if (wd.id) wells[wd.id] = { el, dye };
  });
  if (!spec.gel.wells) spec.lanes.forEach(l => { if (!wells[l.id]) wells[l.id] = null; });

  // leader lines sit under the bands, like the row guides on the original slides
  const leaders = s('svg', { class: 'overlay-svg leader', width: 1920, height: 1080, viewBox: '0 0 1920 1080' });
  sim.appendChild(leaders);

  // bands
  const laneById = {};
  const bandEls = [];       // {lane, idx, el, sp, xs, ys, w}
  spec.lanes.forEach(lane => {
    laneById[lane.id] = lane;
    lane._bands = [];
    (lane.bands || []).forEach((b, i) => {
      const bx = b.x != null ? b.x : laneX(lane, b.y);
      const bw = (b.w || lane.w || 20), bh = Math.max(b.h || 5, 2.4);
      const sp = spec.species[b.sp] || { cls: 'impurity' };
      const cls = sp.cls || 'impurity';
      const it = Math.max(0, Math.min(1, b.i != null ? b.i : .6));
      const el = h('div', 'band c-' + cls, { style: {
        left: X(bx - bw / 2) + 'px', top: Y(b.y - bh / 2) + 'px', width: bw * sc + 'px', height: bh * sc + 'px' } });
      const rot = h('div', 'rot', { style: { transform: `rotate(${tilt}deg)` } });
      const dark = spec.style !== 'light';
      rot.style.setProperty('--o', (0.12 + 0.88 * Math.pow(it, 0.8)).toFixed(3));
      rot.style.setProperty('--hot', dark ? Math.max(0, (it - .62) / .38 * .85).toFixed(3) : '0');
      rot.style.setProperty('--bloom', dark ? Math.max(0, (it - .55) / .45).toFixed(3) : '0');
      rot.style.setProperty('--bl', ((b.blur || 0) + .6) + 'px');
      rot.appendChild(h('div', 'halo'));
      if (b.smear) {
        const sm = b.smear;
        if (sm.up) rot.appendChild(h('div', 'smear up', { style: { height: sm.up * sc + 'px', opacity: (sm.k != null ? sm.k : .5) * (0.12 + 0.88 * it) } }));
        if (sm.down) rot.appendChild(h('div', 'smear down', { style: { height: sm.down * sc + 'px', opacity: (sm.kd != null ? sm.kd : (sm.k != null ? sm.k : .5)) * (0.12 + 0.88 * it) } }));
      }
      rot.appendChild(h('div', 'bloom'));
      rot.appendChild(h('div', 'core'));
      rot.appendChild(h('div', 'hot'));
      el.appendChild(rot);
      el.style.opacity = 0;
      sim.appendChild(el);
      const rec = { lane: lane.id, idx: i, el, sp: b.sp, cls, x: X(bx), y: Y(b.y), w: bw * sc, h: bh * sc,
        wx: X(laneX(lane, wellAt(bx))), wy: Y(wellAt(bx)) };
      lane._bands.push(rec); bandEls.push(rec);
    });
  });

  // lane headers & group brackets
  const heads = {};
  spec.lanes.forEach(lane => {
    if (!lane.label && !lane.chip && !lane.sub) return;
    const wx = laneX(lane, wellY);
    const el = h('div', 'lane-head fade', { style: { left: X(wx) + 'px', top: Y(wellAt(wx)) - 10 + 'px' } });
    let html = '';
    if (lane.label) html += `<span class="${lane.chip ? 'chip ' + lane.chip : ''}">${lane.label}</span>`;
    if (lane.sub) html += `<span class="sub">${lane.sub}</span>`;
    el.innerHTML = html;
    el.classList.add('hidden');
    sim.appendChild(el); heads[lane.id] = el;
  });
  const groups = (spec.groups || []).map(gp => {
    const ls = gp.lanes.map(id => laneById[id]).filter(Boolean);
    const xs = ls.map(l => laneX(l, wellY));
    const x0 = Math.min(...xs.map((x, i) => x - (ls[i].w || 20) / 2)), x1 = Math.max(...xs.map((x, i) => x + (ls[i].w || 20) / 2));
    const hasSub = ls.some(l => l.sub);
    const top = Y(wellAt((x0 + x1) / 2)) - (hasSub ? 58 : 40);
    const el = h('div', 'grp fade hidden' + (gp.tone ? ' grp-' + gp.tone : ''), { style: { left: X(x0) + 'px', top: top + 'px', width: (x1 - x0) * sc + 'px' } });
    el.appendChild(h('span', null, { text: gp.label }));
    sim.appendChild(el);
    return { el, lanes: gp.lanes };
  });

  // lane highlight rects (e.g. a column of the conditions table)
  const hls = {};
  spec.lanes.forEach(lane => {
    if (!lane.hl) return;
    const r = lane.hl;
    const el = h('div', 'hl', { style: { left: X(r[0]) + 'px', top: Y(r[1]) + 'px', width: r[2] * sc + 'px', height: r[3] * sc + 'px' } });
    sim.appendChild(el); hls[lane.id] = el;
  });

  // arrows
  const svg = s('svg', { class: 'overlay-svg', width: 1920, height: 1080, viewBox: '0 0 1920 1080' });
  sim.appendChild(svg);
  // arrows are recorded in the spec (ss band -> its hybridized band) but only the real
  // image shows them; the simulation does not draw them
  const arrows = (SHOW_ARROWS || spec.animArrows ? (spec.arrows || []) : []).map(a => {
    const A = laneById[a.from[0]]._bands[a.from[1]], B = laneById[a.to[0]]._bands[a.to[1]];
    if (!A || !B) return null;
    const dir = B.x >= A.x ? 1 : -1;
    let x1 = A.x + dir * A.w * .18, y1 = A.y, x2 = B.x - dir * B.w * .34, y2 = B.y;
    if (Math.abs(x2 - x1) < 26) { x1 = A.x; x2 = B.x - dir * B.w * .22; }
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const ex = x2 - Math.cos(ang) * 9, ey = y2 - Math.sin(ang) * 9;
    const mx = (x1 + ex) / 2, my = (y1 + ey) / 2 - Math.abs(ex - x1) * .08;
    const d = `M${x1.toFixed(1)},${y1.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`;
    const head = (sz) => {
      const p = [[x2, y2], [x2 - Math.cos(ang - .5) * sz, y2 - Math.sin(ang - .5) * sz], [x2 - Math.cos(ang + .5) * sz, y2 - Math.sin(ang + .5) * sz]];
      return p.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
    };
    const g = s('g', { class: 'arrow' });
    const u = s('path', { d, class: 'under' }), o = s('path', { d, class: 'over' });
    g.appendChild(u); g.appendChild(s('polygon', { points: head(17), class: 'head-under' }));
    g.appendChild(o); g.appendChild(s('polygon', { points: head(13), class: 'head-over' }));
    g.style.opacity = 0;
    svg.appendChild(g);
    return { g, paths: [u, o], from: a.from[0], to: a.to[0] };
  }).filter(Boolean);

  // label rails
  const labels = {};
  // pick the rail whose leader would run across the fewest other bands
  const crossCost = (key, side) => {
    const own = bandEls.filter(b => b.sp === key);
    if (!own.length) return 0;
    const t = side === 'left' ? own.reduce((a, b) => (b.x < a.x ? b : a)) : own.reduce((a, b) => (b.x > a.x ? b : a));
    const x0 = side === 'left' ? gl : t.x, x1 = side === 'left' ? t.x : gl + gw;
    return bandEls.reduce((c, b) => {
      if (b === t || b.x < x0 || b.x > x1 || Math.abs(b.y - t.y) > b.h / 2 + 3) return c;
      return c + (b.sp === key ? 0 : b.cls === 'impurity' ? .3 : 1);
    }, 0);
  };
  Object.keys(spec.species).forEach(key => {
    const sp = spec.species[key];
    if (!sp.name || sp.cls === 'impurity') return;
    let side = sp.side;
    if (!side) {
      const pref = ['ds', 'circ'].includes(sp.cls) ? 'right' : 'left', alt = pref === 'left' ? 'right' : 'left';
      side = rails.includes(alt) && crossCost(key, alt) < crossCost(key, pref) ? alt : pref;
    }
    if (!rails.includes(side)) side = rails[0];
    const el = h('div', 'lbl fade hidden c-' + sp.cls + (side === 'left' ? ' l' : ' r'));
    el.innerHTML = sp.note
      ? `<div class="ico">${chimera(sp.icon)}</div><div class="txt"><b>${sp.name}</b><span><i class="sw"></i>${sp.note}</span></div>`
      : `<div class="ico">${chimera(sp.icon)}</div><div class="txt"><b><i class="sw"></i>${sp.name}</b></div>`;
    const railX0 = side === 'left' ? gl - RAILGAP - RAIL : gl + gw + RAILGAP;
    Object.assign(el.style, { left: railX0 + 'px', width: RAIL + 'px', justifyContent: side === 'left' ? 'flex-start' : 'flex-start' });
    sim.appendChild(el);
    const path = s('path', { class: 'b' }), dot = s('circle', { r: 3.2 });
    const lg = s('g', {}); lg.appendChild(path); lg.appendChild(dot); lg.style.opacity = 0;
    leaders.appendChild(lg);
    labels[key] = { el, side, lg, path, dot, railX0, railW: RAIL };
  });

  // caption
  let cap = null;
  if (P.caption) {
    cap = h('div', 'caption', { style: { left: P.caption.x + 'px', top: P.caption.y + 'px', width: P.caption.w + 'px' } });
    root.appendChild(cap);
  }
  const scan = h('div', 'scanline', { style: { left: X(0) + 'px', width: iw * sc + 'px', top: Y(0) + 'px' } });
  gel.appendChild(scan);

  return { spec, root, gel, sim, real, realTag, scan, bandEls, laneById, heads, groups, arrows, labels, hls, wells, cap,
    geom: { X, Y, sc, gl, gt, gw, gh, ox, oy, iw, ih, P }, k: -1 };
}

function panelState(spec, k) {
  // cumulative state after the first k steps (k=0: blank gel)
  const st = { lanes: new Set(), glow: new Set(), cross: {}, real: false, last: null, newest: [] };
  for (let i = 0; i < k; i++) {
    const step = spec.steps[i];
    (step.lanes || []).forEach(l => st.lanes.add(l));
    (step.glow || []).forEach(g => st.glow.add(g[0] + ':' + g[1]));
    Object.assign(st.cross, step.cross || {});   // cross out a species label: { species: 'reason' }
    if (step.real) st.real = true;
    st.last = step; st.newest = step.lanes || [];
  }
  return st;
}

function layoutLabels(G, st) {
  const groupsBySide = { left: [], right: [] };
  for (const key in G.labels) {
    const L = G.labels[key];
    const bands = G.bandEls.filter(b => b.sp === key && st.lanes.has(b.lane));
    L.bands = bands;
    if (!bands.length) continue;
    // aim at the band nearest this rail, so the leader runs along that band's row
    L.tgt = L.side === 'left' ? bands.reduce((a, b) => (b.x - b.w / 2 < a.x - a.w / 2 ? b : a))
                              : bands.reduce((a, b) => (b.x + b.w / 2 > a.x + a.w / 2 ? b : a));
    L.ty = L.tgt.y;
    groupsBySide[L.side].push(L);
  }
  const top = G.geom.P.y - 30, bottom = G.geom.P.y + G.geom.P.h + 20, LH = 62;
  for (const side of ['left', 'right']) {
    const arr = groupsBySide[side].sort((a, b) => a.ty - b.ty);
    // merge overlapping labels into stacks centred on their bands' mean row
    let blocks = arr.map(L => ({ items: [L], t: L.ty }));
    const pos = b => Math.max(top, Math.min(bottom - b.items.length * LH, b.t - b.items.length * LH / 2));
    for (let merged = true; merged;) {
      merged = false;
      for (let i = 0; i < blocks.length - 1; i++) {
        const a = blocks[i], b = blocks[i + 1];
        if (pos(a) + a.items.length * LH > pos(b) + .5) {
          const items = a.items.concat(b.items);
          blocks.splice(i, 2, { items, t: items.reduce((sum, L) => sum + L.ty, 0) / items.length });
          merged = true; break;
        }
      }
    }
    blocks.forEach(b => { const y0 = pos(b); b.items.forEach((L, k) => { L.y = y0 + k * LH; }); });
    arr.forEach(L => {
      L.el.style.top = L.y + 'px';
      L.el.style.height = LH + 'px';
      const ay = L.y + LH / 2;
      const ax = side === 'left' ? L.railX0 + L.railW + 6 : L.railX0 - 6;
      const tgt = L.tgt;
      const tx = side === 'left' ? tgt.x - tgt.w * .42 : tgt.x + tgt.w * .42, ty = tgt.y;
      const edge = side === 'left' ? G.geom.gl : G.geom.gl + G.geom.gw;
      const kx = side === 'left' ? edge - 10 : edge + 10;
      const d = Math.abs(ay - ty) < 1 ? `M${ax},${ay} L${tx},${ty}`
        : `M${ax.toFixed(1)},${ay.toFixed(1)} L${(kx + (side === 'left' ? -18 : 18)).toFixed(1)},${ay.toFixed(1)} L${kx.toFixed(1)},${ty.toFixed(1)} L${tx.toFixed(1)},${ty.toFixed(1)}`;
      L.path.setAttribute('d', d);
      L.dot.setAttribute('cx', tx.toFixed(1)); L.dot.setAttribute('cy', ty.toFixed(1));
    });
  }
}

function applyPanel(G, k, animate) {
  const spec = G.spec, prev = G.k < 0 ? panelState(spec, 0) : panelState(spec, G.k), st = panelState(spec, k);
  const fwd = animate && k === G.k + 1;
  G.k = k;
  const D = 1.5;   // run time of a lane, seconds
  // bands
  const laneOrder = {}; (st.newest || []).forEach((id, i) => laneOrder[id] = i);
  G.bandEls.forEach(b => {
    const vis = st.lanes.has(b.lane), was = prev.lanes.has(b.lane);
    const glow = st.glow.has(b.lane + ':' + b.idx);
    b.el.classList.toggle('glow', glow);
    if (vis && !was && fwd) {
      const delay = .35 + (laneOrder[b.lane] || 0) * .12;
      const dx = b.wx - b.x, dy = b.wy - b.y;
      b.el.style.opacity = 1;
      anim(b.el, { transform: [`translate(${dx}px,${dy}px) scaleY(.6)`, 'translate(0px,0px) scaleY(1)'], opacity: [0, .9, 1] },
        { duration: D, delay, easing: [.33, .62, .28, 1] });
    } else {
      b.el.getAnimations && b.el.getAnimations().forEach(a => a.cancel());
      b.el.style.opacity = vis ? 1 : 0;
      b.el.style.transform = '';
    }
  });
  // wells flash blue (loading dye) when a lane is loaded
  if (fwd) (st.newest || []).forEach((id, i) => {
    if (prev.lanes.has(id)) return;
    const w = G.wells[id]; if (!w) return;
    anim(w.dye, { opacity: [0, .9, .9, 0] }, { duration: 1.1, delay: i * .12, easing: 'ease-out' });
  });
  // headers & groups
  for (const id in G.heads) G.heads[id].classList.toggle('hidden', !st.lanes.has(id));
  G.groups.forEach(gp => gp.el.classList.toggle('hidden', !gp.lanes.some(id => st.lanes.has(id))));
  for (const id in G.hls) G.hls[id].classList.toggle('on', st.newest.includes(id) && !st.real);
  // arrows: visible once both ends are loaded
  G.arrows.forEach(a => {
    const vis = st.lanes.has(a.from) && st.lanes.has(a.to);
    const was = prev.lanes.has(a.from) && prev.lanes.has(a.to);
    a.g.getAnimations && a.g.getAnimations().forEach(x => x.cancel());
    a.g.style.opacity = vis ? 1 : 0;
    if (vis && !was && fwd && !STATIC) {
      a.g.style.opacity = 0;
      anim(a.g, { opacity: [0, 1] }, { duration: .3, delay: D + .2 });
      a.paths.forEach(p => {
        const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
        anim(p, { strokeDashoffset: [L, 0] }, { duration: .55, delay: D + .2, easing: 'ease-out' });
      });
    } else a.paths.forEach(p => { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; });
  });
  // labels
  layoutLabels(G, st);
  for (const key in G.labels) {
    const L = G.labels[key];
    L.el.classList.toggle('crossed', key in st.cross);
    { const tx = L.el.querySelector('.txt'); if (tx) tx.dataset.cross = st.cross[key] || ''; }
    const vis = !!(L.bands && L.bands.length);
    const wasVis = G.bandEls.some(b => b.sp === key && prev.lanes.has(b.lane));
    const glow = L.bands && L.bands.some(b => st.glow.has(b.lane + ':' + b.idx));
    L.el.classList.toggle('glow', !!glow);
    if (vis && !wasVis && fwd && !STATIC) {
      L.el.style.transitionDelay = (D * .8) + 's'; L.lg.style.transition = 'opacity .35s ease ' + (D * .8) + 's';
    } else { L.el.style.transitionDelay = '0s'; L.lg.style.transition = 'none'; }
    L.el.classList.toggle('hidden', !vis);
    L.lg.style.opacity = vis ? 1 : 0;
  }
  // caption
  if (G.cap) {
    const n = spec.steps.length;
    if (k === 0) G.cap.innerHTML = `<span class="k">0 / ${n}</span><span>${spec.blank || 'Blank gel'}</span>`;
    else G.cap.innerHTML = `<span class="k">${k} / ${n}</span><span>${st.last.say || ''}</span>`;
  }
  // real image swap
  const realOn = st.real, realWas = prev.real;
  G.real.getAnimations && G.real.getAnimations().forEach(a => a.cancel());
  G.sim.getAnimations && G.sim.getAnimations().forEach(a => a.cancel());
  if (TEST && MODE === 'real') { G.real.style.opacity = 1; G.sim.style.opacity = 0; return; }
  if (TEST && MODE === 'overlay') return;
  if (realOn && !realWas && fwd && !STATIC) {
    G.real.style.opacity = 1;
    anim(G.real, { clipPath: ['inset(0 0 100% 0)', 'inset(0 0 0% 0)'] }, { duration: 1.25, easing: [.45, .05, .25, 1] });
    anim(G.scan, { top: [G.geom.Y(0) + 'px', G.geom.Y(G.geom.ih) + 'px'], opacity: [0, 1, 1, 0] }, { duration: 1.25, easing: [.45, .05, .25, 1] });
    G.sim.style.transition = 'opacity .6s ease .65s';
    G.sim.style.opacity = 0;
  } else {
    G.sim.style.transition = 'none';
    G.real.style.opacity = realOn ? 1 : 0;
    G.real.style.clipPath = '';
    G.sim.style.opacity = realOn ? 0 : 1;
  }
  G.realTag.style.opacity = realOn ? 1 : 0;
}

/* ---------------- bar charts ---------------- */
function buildChartPanel(slideEl, spec, P) {
  const iw = spec.size[0], ih = spec.size[1];
  const sc = Math.min(P.w / iw, P.h / ih);
  const ox = P.x + (P.w - iw * sc) / 2, oy = P.y + Math.max(0, P.h - ih * sc) * .3;
  const root = h('div', 'panel'); slideEl.appendChild(root);
  const box = { left: ox + 'px', top: oy + 'px', width: iw * sc + 'px', height: ih * sc + 'px' };
  const real = h('div', 'real', { style: box });
  real.appendChild(h('img', null, { src: spec.image, alt: spec.title + ' bar chart as on the original slide', draggable: 'false' }));
  const sim = h('div', 'chart-sim sim-layer', { style: box });
  root.appendChild(sim); root.appendChild(real);
  const realTag = h('div', 'real-tag', { text: 'Original chart', style: { left: ox + 'px', top: oy - 34 + 'px' } });
  root.appendChild(realTag);
  const scan = h('div', 'scanline', { style: { left: ox + 'px', width: iw * sc + 'px', top: oy + 'px' } });
  root.appendChild(scan);
  const svg = s('svg', { viewBox: `0 0 ${iw} ${ih}`, width: iw * sc, height: ih * sc });
  sim.appendChild(svg);
  const Y = v => spec.zero - v * spec.ppu;
  const bars = spec.bars, pitch = bars.length > 1 ? bars[1].x - bars[0].x : 120;
  const xL = bars[0].x - .75 * pitch, xR = bars[bars.length - 1].x + .75 * pitch;
  const add = (tag, a, txt) => { const e = s(tag, a); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; };
  add('rect', { x: 0, y: 0, width: iw, height: ih, fill: '#fbfbf9' });
  add('text', { x: iw * .06, y: ih * .085, 'font-size': ih * .056, 'font-weight': 700, fill: '#1b1f24' }, spec.title);
  add('text', { x: iw * .06, y: ih * .135, 'font-size': ih * .03, fill: '#7a8086' }, spec.sub);
  spec.ticks.forEach(v => {
    add('line', { x1: xL, x2: xR, y1: Y(v), y2: Y(v), stroke: v === 0 ? '#9aa0a6' : '#e3e5e8', 'stroke-width': v === 0 ? 1.6 : 1.2 });
    add('text', { x: xL - 10, y: Y(v) + 5, 'text-anchor': 'end', 'font-size': ih * .04, fill: '#4f555b', class: 'tick' }, v.toFixed(spec.fmt));
  });
  const yl = add('text', { x: 0, y: 0, 'text-anchor': 'middle', 'font-size': ih * .042, 'font-weight': 600, fill: '#2b3036',
    transform: `translate(${Math.max(xL - iw * .135, ih * .03)},${(Y(0) + Y(spec.ticks[spec.ticks.length - 1])) / 2}) rotate(-90)` }, spec.ylabel);
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const sd = a => { const m = mean(a); return a.length > 1 ? Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / (a.length - 1)) : 0; };
  let top = -1, topV = -1;
  const W = spec.barW || 27;
  const groups = bars.map((b, i) => {
    const m = b.mean != null ? b.mean : mean(b.reps), e = sd(b.reps);
    if (m > topV) { topV = m; top = i; }
    const g = s('g', {}); svg.appendChild(g);

/* ---------------- slides ---------------- */
const slides = [];

let cur = { s: 0, k: 0 };

  slides.forEach((x, i) => x.el.querySelectorAll('video').forEach(v => { if (v.dataset.managed != null) { if (i !== si) { v.pause(); v._seg = undefined; } return; } if (i === si && !STATIC) { const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); } else v.pause(); }));

function next() { const S = slides[cur.s]; if (cur.k < S.steps.length - 1) show(cur.s, cur.k + 1, true); else if (cur.s < slides.length - 1) show(cur.s + 1, 0, false); }
function prev() { if (cur.k > 0) show(cur.s, cur.k - 1, false); else if (cur.s > 0) show(cur.s - 1, slides[cur.s - 1].steps.length - 1, false); }

function fit() {
  const vp = document.getElementById('viewport').getBoundingClientRect();
  const k = Math.min(vp.width / 1920, vp.height / 1080);
  stage.style.transform = `translate(${-960 * k}px, ${-540 * k}px) scale(${k})`;
}

function boot() {
  let list = DECK.slides;
  if (TEST) {
    document.body.style.padding = '0';
    document.documentElement.classList.add('is-test');
    document.getElementById('hud').style.display = 'none';
    document.getElementById('stage').style.boxShadow = 'none';
    const spec = DECK.gels[TEST];
    // lay the slide out with all its panels, then build only the gel under test
    const cfg = DECK.slides.find(sl => (sl.panels || []).some(p => p.gel === TEST)) || { kind: 'gel', title: TEST, panels: [{ gel: TEST }] };
    autoPanels(cfg);

  }
  DECK.slides.forEach((cfg, i) => {
    if (cfg.kind === 'gel' && !TEST) autoPanels(cfg);

  });

  let si = 0;
  const m = /^#s(\d+)$/.exec(location.hash); if (m) si = (+m[1]) - 1;
  if (TEST) {
    const S = slides[0]; const want = Q.get('step');
    show(0, want != null ? +want : (MODE === 'real' ? S.steps.length - 1 : S.steps.length - 2), false);
    document.body.dataset.geom = JSON.stringify(S.panels.map(G => ({ scale: +G.geom.sc.toFixed(3), imageLeft: +G.geom.ox.toFixed(1), imageTop: +G.geom.oy.toFixed(1), gelLeft: +G.geom.gl.toFixed(1), gelTop: +G.geom.gt.toFixed(1), gelW: +G.geom.gw.toFixed(1), gelH: +G.geom.gh.toFixed(1) })));
  } else if (SHOT) {
    document.body.style.padding = '0'; document.documentElement.classList.add('is-test');
    document.getElementById('hud').style.display = 'none';
    show(+SHOT - 1, +(Q.get('step') || 0), false);
  } else show(si, 0, false);
}

function autoPanels(cfg) {
  // default panel rectangles for one or two gels
  const top = cfg.top || (cfg.subtitle ? 212 : 160), bottom = 960;
  const n = (cfg.panels || []).length;
  (cfg.panels || []).forEach((p, i) => {
    if (p.x != null) return;
    if (n === 1) {
      Object.assign(p, { x: 64, y: top + 20, w: 1792, h: bottom - top - 20 - 50 });
      if (!p.ib) p.ib = [16, top - 16, 1904, bottom - 44];
    } else if (n >= 3) {
      const w = Math.floor((1872 - (n - 1) * 20) / n);
      Object.assign(p, { x: 24 + i * (w + 20), y: top + 30, w, h: bottom - top - 30 - 70 });
    } else {
      const w = 900;
      Object.assign(p, { x: i === 0 ? 40 : 980, y: top + (p.head ? 56 : 30), w, h: bottom - top - (p.head ? 56 : 30) - 50 });
      if (!p.rails) p.rails = [i === 0 ? 'left' : 'right'];
      if (!p.ib) p.ib = [p.x - 16, p.y - 10, p.x + p.w + 16, bottom - 44];
    }
    if (p.chart) p.h -= 44;           // room below each chart for its concentration labels
    if (!p.caption) p.caption = { x: p.x + 24, y: bottom - 30, w: p.w - 48 };
    if (p.head && p.headY == null) p.headY = p.y - 46;

}

// keys pressed inside an embedded viewer are forwarded here
addEventListener('message', e => {
  const k = e.data && e.data.deckKey; if (!k) return;
  dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
});
// type a slide number then Enter to jump there (Esc cancels)
let typed = '', typedTimer = null;
const goto = h('div', 'goto', { 'aria-live': 'polite' }); document.body.appendChild(goto);
function setTyped(v) {
  typed = v; clearTimeout(typedTimer);
  goto.textContent = typed ? `Go to slide ${typed} of ${slides.length} — Enter` : '';
  goto.classList.toggle('on', !!typed);
  if (typed) typedTimer = setTimeout(() => setTyped(''), 4000);
}
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); setTyped((typed + e.key).slice(0, 3)); return; }
  if (typed) {
    if (e.key === 'Enter') { e.preventDefault(); const n = parseInt(typed, 10); setTyped(''); if (n >= 1 && n <= slides.length) show(n - 1, 0, false); return; }
    if (e.key === 'Backspace') { e.preventDefault(); setTyped(typed.slice(0, -1)); return; }
    if (e.key === 'Escape') { setTyped(''); return; }
  }
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter', 'n'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'Home') show(0, 0, false);
  else if (e.key === 'End') show(slides.length - 1, 0, false);
  else if (e.key === 'f') toggleFull();
  else if (e.key === 'p' || e.key === 'P') setPaused(!PAUSED);
});
document.getElementById('viewport').addEventListener('click', e => { if (e.clientX < innerWidth * .2) prev(); else next(); });
document.getElementById('b-prev').addEventListener('click', e => { e.stopPropagation(); if (cur.s > 0) show(cur.s - 1, 0, false); });
document.getElementById('b-next').addEventListener('click', e => { e.stopPropagation(); if (cur.s < slides.length - 1) show(cur.s + 1, 0, false); });
function toggleFull() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
}
const gotoIn = document.getElementById('goto-n');
gotoIn.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' || e.key === 'Escape') { const n = parseInt(gotoIn.value, 10); if (e.key === 'Enter' && n >= 1 && n <= slides.length) show(n - 1, 0, false); gotoIn.blur(); } });
gotoIn.addEventListener('focus', () => gotoIn.select());
gotoIn.addEventListener('blur', () => { gotoIn.value = `${cur.s + 1}/${slides.length}`; });
gotoIn.addEventListener('click', e => e.stopPropagation());
document.getElementById('b-full').addEventListener('click', e => { e.stopPropagation(); toggleFull(); });
document.getElementById('b-pause').addEventListener('click', e => { e.stopPropagation(); setPaused(!PAUSED); });
let tx0 = null;
addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; }, { passive: true });
addEventListener('touchend', e => { if (tx0 == null) return; const dx = e.changedTouches[0].clientX - tx0; if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); } tx0 = null; });

if (DECK && DECK.slides && DECK.slides.length) boot();
window.__deck = { show, next, prev, slides, chimera };
})();
